[project]
name = "finance-analytics"
version = "0.1.0"
description = "Python analytics workspace for Finance Analytics transaction data"
readme = "README.md"
authors = [
    { name = "Maria Ines Fonseca", email = "mariainesfonseca04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
